<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!--
    The app's own mark: a journey — two stops and the route between them.

    Wine and orange are the operator's colours, the same pair the app bar wears
    (`chrome` and `accent` in src/styles/index.css). Written as literal hex here
    because a favicon is a standalone document with no access to the
    stylesheet's tokens; every other use of these colours goes through them.

    Single-colour ground rather than a theme-aware one: a browser draws this at
    16px against whatever its own tab strip is, light or dark, and a mark that
    tries to follow the page's scheme has no page to follow.
  -->
  <rect width="48" height="48" rx="11" fill="#851c45"/>
  <g fill="none" stroke="#f78f3c" stroke-width="3.2" stroke-linecap="round">
    <path d="M15 17.5v6.2a4 4 0 0 0 4 4h10a4 4 0 0 1 4 4v2.8" stroke-dasharray="0.1 6.4"/>
    <circle cx="15" cy="13" r="4.4"/>
    <circle cx="33" cy="35" r="4.4"/>
  </g>
</svg>
