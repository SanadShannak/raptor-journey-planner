services:

  backend:
    image: ghcr.io/sanadshannak/journey-planner-backend:2.0
    platform: linux/amd64
    deploy:
      resources:
        limits:
          memory: 1700mb
    container_name: journey-planner-backend
    restart: always
    env_file:
      - backend/.env
    environment:
      ACTIVE_NETWORK: ${ACTIVE_NETWORK:?Set ACTIVE_NETWORK in the .env file beside this compose file}
      # The heap the compiled feed needs, overriding the image's 1024: the
      # October 2026 HSL feed no longer fits in 1024 and the backend died while
      # loading it. Keep the container limit above this; see README *Memory*.
      NODE_OPTIONS: --max-old-space-size=1280
    volumes:
      - type: bind
        source: ./processed-data/${ACTIVE_NETWORK:?Set ACTIVE_NETWORK in the .env file beside this compose file}-processed-data
        target: /processed-data/${ACTIVE_NETWORK:?Set ACTIVE_NETWORK in the .env file beside this compose file}-processed-data
        read_only: true
    networks:
      - journey-planner-network
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"
        
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    image: ghcr.io/sanadshannak/journey-planner-frontend:2.0
    platform: linux/amd64
    deploy:
      resources:
        limits:
          memory: 128mb
    container_name: journey-planner-frontend
    restart: always
    volumes:
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
      # The access log (see the Caddyfile): nothing personal is written to it.
      - ./logs:/logs
    networks:
      - othman_default
      - journey-planner-network
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy

networks:
  othman_default:
    external: true
  journey-planner-network:
    driver: bridge



